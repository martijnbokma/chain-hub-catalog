name: Regenerate catalog

# Re-indexes the repos in collections.json daily so new upstream skills, agents
# and workflows appear without hand edits. Only validated output is committed.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collections.json, overrides.json, scripts/generate.mjs]

permissions:
  contents: write

concurrency:
  group: regenerate-catalog
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate.mjs
      - run: node scripts/validate.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore: regenerate catalog.json"
          git push
